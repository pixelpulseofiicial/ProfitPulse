<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProfitPulse — Result</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="top-bar">
      <a href="/" class="top-bar-brand">
        <img src="/logo.svg" alt="" class="pp-logo-img pp-logo-img--sm" width="32" height="32" />
        <h1>ProfitPulse</h1>
      </a>
    </header>

    <main class="result-page">
      <h2 class="company-name" id="company-name">Loading…</h2>
      <p class="loading" id="status">Analyzing stock data…</p>
      <p class="signal" id="signal" hidden></p>
      <p class="score-pill" id="score-pill" hidden></p>

      <section class="chart-container" id="chart-section" hidden>
        <div class="chart-wrapper">
          <canvas id="metricsChart"></canvas>
          <p class="chart-label">Health Radar</p>
        </div>
        <div class="chart-wrapper">
          <canvas id="priceChart"></canvas>
          <p class="chart-label">Price Trend (1Y)</p>
        </div>
      </section>

      <section class="details" id="details" hidden>
        <h2>Why?</h2>
        <ul id="reasons"></ul>
      </section>

      <p class="error-msg" id="error" hidden></p>
      <a class="back-link" href="/">← Back to search</a>
    </main>

    <script src="/js/company.js"></script>
  </body>
</html>
